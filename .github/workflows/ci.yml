name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, and all three test tiers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build and check the bundle budget
        run: npm run size

      - name: Unit, component and integration tests, with coverage thresholds
        run: npm run test:node -- --coverage

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Playwright serves the production build, so this exercises what actually ships, on
      # all three engines.
      - name: End-to-end tests against the production build
        run: npm run test:e2e

      # `npm run test:perf` is deliberately absent, and so is `npm run verify`, which would
      # pull it in. The timing suite asserts milliseconds against budgets calibrated on an idle
      # developer machine; a shared two-core runner would breach them at random, and a suite
      # that fails at random is one people learn to ignore. It is a local gate, not a CI gate.

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
