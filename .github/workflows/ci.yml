name: CI

# A change to Markdown alone does not need a build or three browsers. Prettier still checks
# Markdown, but the pre-commit hook formats it before a commit exists, so CI is only a backstop
# there.
#
# This is safe because no status check is required to merge: branch protection is not enforced on
# a private repository on the Free plan. If that changes -- the repository is made public, or the
# account moves to a paid plan and required checks are switched on -- a skipped workflow reports
# nothing and a documentation pull request can never be merged. At that point this has to become
# two jobs: a cheap one that always runs, and an expensive one conditional on the changed files.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, and all three test tiers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build and check the bundle budget
        run: npm run size

      - name: Unit, component and integration tests, with coverage thresholds
        run: npm run test:node -- --coverage

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Playwright serves the production build, so this exercises what actually ships, on
      # all three engines.
      - name: End-to-end tests against the production build
        run: npm run test:e2e

      # `npm run test:perf` is deliberately absent, and so is `npm run verify`, which would
      # pull it in. The timing suite asserts milliseconds against budgets calibrated on an idle
      # developer machine; a shared two-core runner would breach them at random, and a suite
      # that fails at random is one people learn to ignore. It is a local gate, not a CI gate.

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
