name: CI

# One engine by default, all three on request.
#
# The end-to-end tier is the only expensive part, and it is expensive because it can be paid three
# times over. Nothing about a typical change is engine-specific, so every automatic run uses
# chromium alone and comes back in a few minutes -- fast enough that the result arrives while the
# change is still in mind, which is the only speed that matters for a gate. A manual dispatch runs
# all three, which is how a cross-engine divergence gets caught: deliberately, before a release or
# after touching anything layout- or event-related, rather than by paying for it on every push.
#
# The engines are named once, below, and everything else follows from that.
#
# There is no nightly schedule. It ran the three-engine suite every night against a commit nobody
# had touched, which on a private repository is roughly 450 of the 2,000 monthly Actions minutes
# the Free plan includes -- the largest single line in the bill and the one with the least to show
# for it. If the account ever moves to a plan with minutes to spare, a nightly run is worth having
# back; until then a dispatch before a release covers the same ground on demand.
#
# A change to Markdown alone does not need a build or three browsers. Prettier still checks
# Markdown, but the pre-commit hook formats it before a commit exists, so CI is only a backstop
# there.
#
# This repository has no required status checks -- branch protection is not available on a private
# repository on the Free plan. A red run therefore blocks nothing on its own, which is exactly how
# a broken end-to-end suite once reached main and stayed there for a week. What stands in for it is
# a rule in CONTRIBUTING.md and a pre-push hook that runs this same fast gate locally. If the
# account ever moves to a paid plan, make this workflow a required check and delete this paragraph.
on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, and all test tiers
    runs-on: ubuntu-latest

    # A full run is about ten minutes. The default cap is six hours, so a single job wedged on a
    # hung browser would spend a fifth of the monthly allowance before anyone noticed.
    timeout-minutes: 25

    env:
      ENGINES: ${{ github.event_name == 'workflow_dispatch' && 'chromium firefox webkit' || 'chromium' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build and check the bundle budget
        run: npm run size

      - name: Unit, component and integration tests, with coverage thresholds
        run: npm run test:node -- --coverage

      # Keyed on the engines as well as the lockfile: a cache holding only chromium must not be
      # served to a run that needs all three.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ github.event_name == 'workflow_dispatch' && 'all' || 'chromium' }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps $ENGINES

      # Playwright serves the production build, so this exercises what actually ships.
      - name: End-to-end tests against the production build
        run: |
          projects=""
          for engine in $ENGINES; do projects="$projects --project=$engine"; done
          echo "Running the end-to-end tier on:$projects"
          npx playwright test $projects

      # `npm run test:perf` is deliberately absent, and so is `npm run verify`, which would
      # pull it in. The timing suite asserts milliseconds against budgets calibrated on an idle
      # developer machine; a shared two-core runner would breach them at random, and a suite
      # that fails at random is one people learn to ignore. It is a local gate, not a CI gate.

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          # One day. The report is read within minutes of the run that produced it or not at
          # all, and artifact storage is the other metered resource on the Free plan.
          retention-days: 1
